name: CI
on:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: tuqulore/.github/setup@44d876858234517f08bae619b27d883c2b37a8a4 # main
      - run: pnpm lint
      - run: pnpm -r test
      - uses: tuqulore/.github/format@44d876858234517f08bae619b27d883c2b37a8a4 # main
